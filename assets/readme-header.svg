<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Agent Meter</title>
  <desc id="desc">Animated banner for the Agent Meter desktop application</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09100c"/>
      <stop offset="0.55" stop-color="#111b14"/>
      <stop offset="1" stop-color="#09100c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cff00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9cff00" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9cff00" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#2b3a2e" stroke-width="2"/>
  <g transform="translate(92 78)">
    <rect width="112" height="112" rx="25" fill="#9cff00" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.82;1;0.82" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#081009">AM</text>
  </g>
  <text x="244" y="126" font-family="Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="2" fill="#f4f7f4">AGENT METER</text>
  <text x="248" y="174" font-family="Arial, sans-serif" font-size="24" fill="#9ba89f">Telemetria local para seus agentes de IA</text>
  <g transform="translate(248 214)">
    <circle cx="8" cy="8" r="8" fill="#9cff00">
      <animate attributeName="r" values="6;9;6" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="15" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#9cff00">LOCAL • PRIVADO • TEMPO REAL</text>
  </g>
  <rect x="0" y="274" width="280" height="3" fill="url(#glow)">
    <animate attributeName="x" values="-280;1200" dur="4.2s" repeatCount="indefinite"/>
  </rect>
</svg>
